# =====================================================================
# issue-djinn - Quarkus Backend Skeleton
# =====================================================================
# This file contains STRUCTURAL configuration only.
# 
# STRUCTURAL CONFIG:
# - Datasource driver and JDBC URL with PRAGMAs (journal_mode=WAL, busy_timeout, foreign_keys)
# - Hibernate dialect property pointing at the community SQLite dialect
# - Flyway configuration (migrate-at-start, locations)
# - Quinoa configuration (ui-dir, build-dir, enable-spa-routing, ignored-path-prefixes)
# - MCP server configuration (root-path=/mcp)
# - REST path configuration (quarkus.rest.path=/api)
#
# RUNTIME CONFIG:
# - Data directory default (issue-djinn.data.dir or ISSUE_DJINN_DATA_DIR environment variable, default ~/.issue-djinn)
# - DB path is derived from data directory: {data_dir}/issue-djinn.db
# - Port configuration (quarkus.http.port or ISSUE_DJINN_PORT environment variable, default 5444)
# - Host configuration (quarkus.http.host or ISSUE_DJINN_HOST environment variable, default 127.0.0.1)
# - Environment variable overrides
# =====================================================================

# --- Datasource ---
quarkus.datasource.db-kind=other
quarkus.datasource.jdbc.driver=org.sqlite.JDBC
# JDBC URL with SQLite PRAGMAs:
# - journal_mode=WAL: persistent WAL mode for concurrent read/write
# - busy_timeout=5000: 5-second busy timeout for write contention
# - foreign_keys=on: enable foreign key constraints (off by default in SQLite)
quarkus.datasource.jdbc.url=jdbc:sqlite:${issue-djinn.db.path}?journal_mode=WAL&busy_timeout=5000&foreign_keys=on

# JDBC pool sizing (small pool for single-writer + many-readers under WAL)
quarkus.datasource.jdbc.min-size=1
quarkus.datasource.jdbc.max-size=4
quarkus.datasource.jdbc.acquisition-timeout=5S
quarkus.datasource.jdbc.background-validation-interval=0
quarkus.datasource.jdbc.leak-detection-interval=10M
quarkus.datasource.jdbc.multiple-acquisition=warn

# Issue-djinn data directory; default to ~/.issue-djinn if not set.
# Runtime config: the exact default-path convention and environment variable overrides.
# The DB path is derived from the data directory: {data_dir}/issue-djinn.db
issue-djinn.data.dir=${ISSUE_DJINN_DATA_DIR:${user.home}/.issue-djinn}
issue-djinn.db.path=${issue-djinn.data.dir}/issue-djinn.db

# --- Test profile ---
%test.quarkus.flyway.migrate-at-start=true
%test.quarkus.flyway.locations=db/migration
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.datasource.jdbc.url=jdbc:sqlite:${quarkus.test.db.path}?journal_mode=WAL&busy_timeout=5000&foreign_keys=on
%test.issue-djinn.db.path=${quarkus.test.db.path}
%test.issue-djinn.data.dir=target/test-issue-djinn-data-dir
%test.quarkus.test.db.path=target/test-issue-djinn.db

# --- Hibernate / JPA ---
# Community SQLite dialect from hibernate-community-dialects
# Flyway owns the schema (migrate-at-start); Hibernate must not drop/recreate it.
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.dialect=org.hibernate.community.dialect.SQLiteDialect
quarkus.hibernate-orm.log.sql=false
%dev.quarkus.hibernate-orm.log.sql=false

# --- Flyway ---
# Migrate at startup, locations in db/migration
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

# --- Quinoa (frontend build + SPA routing) ---
# UI directory and build output
quarkus.quinoa.ui-dir=ui
quarkus.quinoa.build-dir=build
quarkus.quinoa.enable-spa-routing=true

# Ignore REST and MCP paths from SPA routing
# /api is auto-excluded via quarkus.rest.path=/api below; /mcp must be added explicitly
quarkus.quinoa.ignored-path-prefixes=/mcp

# Dev server properties
%dev.quarkus.quinoa.dev-server.port=5173
%dev.quarkus.quinoa.dev-server.index-page=/
%dev.quarkus.quinoa.dev-server.logs=true

# --- MCP Server (HTTP Streamable transport) ---
# Reject unknown fields in request bodies: a client-side rename must
# fail loudly, not silently drop the value.
quarkus.jackson.fail-on-unknown-properties=true
quarkus.mcp.server.http.root-path=/mcp
%dev.quarkus.mcp.server.traffic-logging.enabled=true

# --- HTTP Server ---
# Host configuration: default 127.0.0.1 (loopback-only), override via ISSUE_DJINN_HOST or quarkus.http.host
quarkus.http.host=${ISSUE_DJINN_HOST:127.0.0.1}
# Default port is 5444; override via ISSUE_DJINN_PORT or quarkus.http.port
quarkus.http.port=${ISSUE_DJINN_PORT:5444}

# --- REST ---
# Base path for all REST endpoints. Scoping REST under /api keeps Quinoa's SPA
# routing working: a global ExceptionMapper would otherwise intercept the
# routing NotFoundException and break SPA re-routing to index.html.
quarkus.rest.path=/api

# --- Live events (SSE) ---
# How often an idle GET /api/events connection receives a heartbeat SSE comment.
issue-djinn.events.heartbeat-interval=15S
%test.issue-djinn.events.heartbeat-interval=1S
